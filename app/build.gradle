plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose.compiler)
    alias(libs.plugins.ksp)
    id 'dagger.hilt.android.plugin'
    alias(libs.plugins.protobuf)
    id 'jacoco'
}

jacoco {
    toolVersion = libs.versions.jacocoTool.get()
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId "chrismw.budgetcalc"
        minSdk 23
        targetSdk 37
        versionCode 7
        versionName "1.0.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    namespace 'chrismw.budgetcalc'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobufProtoc.get()}"
    }
    // Generates the java Protobuf-lite code for the Protobufs in this project. See
    // https://github.com/google/protobuf-gradle-plugin#customizing-protobuf-compilation
    // for more information.
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {

    implementation libs.androidx.appcompat
    implementation libs.material

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material3.windowsizeclass
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.accompanist.systemuicontroller

    implementation libs.androidx.constraintlayout
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    //Hilt
    implementation libs.hilt.android
    ksp libs.hilt.android.compiler

    //Data store
    implementation libs.androidx.datastore
    implementation libs.protobuf.javalite

    //Moshi
    implementation libs.moshi
    implementation libs.moshi.kotlin
    ksp libs.moshi.kotlin.codegen

    //Navigation
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.hilt.navigation.compose

    implementation libs.kotlinx.collections.immutable


    coreLibraryDesugaring(libs.android.desugar.jdk.libs)
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core

    // Local unit tests
    testImplementation libs.androidx.test.core
    testImplementation libs.junit
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.truth
    testImplementation libs.mockk
    testImplementation(libs.turbine)
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', 'android/**/*.*',
            '**/*_Factory.class', '**/*_MembersInjector.class',
            '**/Hilt_*.class', '**/*_HiltModules*.class', '**/*_HiltComponents*.class',
            '**/dagger/**', '**/hilt_aggregated_deps/**',
            '**/*Dagger*.*', '**/*Hilt*.*',
            '**/*ComposableSingletons*.*',
            '**/databinding/**/*.*', '**/android/databinding/*Binding.*',
            '**/*$Lambda$*.*', '**/*$inlined$*.*',
            '**/*_Impl.*',

            // Generated Protobuf DataStore schema classes (app/build/generated/**/proto/**)
            '**/BudgetData.class', '**/BudgetData$*.class',
            '**/BudgetDataPreferences.class', '**/BudgetDataPreferences$*.class', '**/BudgetDataPreferencesOrBuilder.class',
            '**/BudgetTypePreferences.class', '**/BudgetTypePreferences$*.class',

            // Generated Moshi JSON adapters (KSP codegen)
            '**/*JsonAdapter.class',
    ]

    // Must be the classes actually loaded at test runtime (post Hilt/Compose ASM transform),
    // not the raw kotlinc output - otherwise Jacoco's class IDs won't match the execution data.
    def debugTree = fileTree(
            dir: "$project.buildDir/intermediates/classes/debug/transformDebugClassesWithAsm/dirs",
            excludes: fileFilter,
    )
    def mainSrc = "$project.projectDir/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
    ]))
}
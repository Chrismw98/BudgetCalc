// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    ext {
        hilt_version = '2.60.1'
        compose_ui_version = '1.7.8'
        compose_material_version = '1.7.8'
        compose_material3_version = '1.3.0'

        androidx_lifecycle_version = '2.6.1'

        androidx_navigation_version = '2.9.7'
        androidx_hilt_navigation_version = '1.2.0'

        kotlinx_immutable_collections_version = '0.3.5'

        accompanist_version = '0.34.0'

        protobuf_javalite_version = '4.33.5'
        protobuf_protoc_version = '4.33.5'
        datastore_version = '1.0.0'

        moshi_version = '1.15.2'
    }

    dependencies {
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20"
    }
}

plugins {
    id 'com.android.application' version '9.2.1' apply false
    id 'com.android.library' version '9.2.1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20' apply false
    id 'com.google.devtools.ksp' version '2.3.12' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}